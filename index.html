<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Flick</title>
  </head>
  <body>
    <div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i></div>
    <!--
      JS が読み込まれる前から表示される静的スケルトン。
      src/components/Skeleton.tsx と同一のマークアップなので、React に引き継がれても見た目は途切れない。
    -->
    <div id="root">
      <div class="app" data-testid="skeleton" data-state="boot" aria-busy="true">
        <header class="topbar" aria-hidden="true">
          <div class="brand"><div class="sk sk-logo"></div><div class="sk sk-line" style="width: 54px; height: 16px"></div></div>
          <div class="sk sk-avatar"></div>
        </header>
        <div class="composer glass" aria-hidden="true"><div class="sk sk-line" style="width: 34%; height: 14px; margin-left: 36px"></div></div>
        <div class="tabs sk-tabs" aria-hidden="true"><div class="sk" style="height: 40px; border-radius: 999px; width: 100%"></div></div>
        <div class="board is-skeleton" aria-hidden="true">
          <section class="column glass"><div class="col-head"><div class="sk sk-dot"></div><div class="sk sk-line" style="width: 56px; height: 14px"></div></div><ul class="list">
            <li class="card glass sk-card"><div class="sk sk-circle"></div><div class="sk-card-lines"><div class="sk sk-line" style="width: 88%"></div><div class="sk sk-line" style="width: 46%; height: 10px"></div></div></li>
            <li class="card glass sk-card"><div class="sk sk-circle"></div><div class="sk-card-lines"><div class="sk sk-line" style="width: 74%"></div><div class="sk sk-line" style="width: 54%; height: 10px"></div></div></li>
            <li class="card glass sk-card"><div class="sk sk-circle"></div><div class="sk-card-lines"><div class="sk sk-line" style="width: 60%"></div><div class="sk sk-line" style="width: 62%; height: 10px"></div></div></li>
          </ul></section>
          <section class="column glass"><div class="col-head"><div class="sk sk-dot"></div><div class="sk sk-line" style="width: 56px; height: 14px"></div></div><ul class="list">
            <li class="card glass sk-card"><div class="sk sk-circle"></div><div class="sk-card-lines"><div class="sk sk-line" style="width: 88%"></div><div class="sk sk-line" style="width: 46%; height: 10px"></div></div></li>
            <li class="card glass sk-card"><div class="sk sk-circle"></div><div class="sk-card-lines"><div class="sk sk-line" style="width: 74%"></div><div class="sk sk-line" style="width: 54%; height: 10px"></div></div></li>
          </ul></section>
          <section class="column glass"><div class="col-head"><div class="sk sk-dot"></div><div class="sk sk-line" style="width: 56px; height: 14px"></div></div><ul class="list">
            <li class="card glass sk-card"><div class="sk sk-circle"></div><div class="sk-card-lines"><div class="sk sk-line" style="width: 88%"></div><div class="sk sk-line" style="width: 46%; height: 10px"></div></div></li>
            <li class="card glass sk-card"><div class="sk sk-circle"></div><div class="sk-card-lines"><div class="sk sk-line" style="width: 74%"></div><div class="sk sk-line" style="width: 54%; height: 10px"></div></div></li>
          </ul></section>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
